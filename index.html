nav{
  position:sticky;
  top:0;

}

.nav{

    rgba(255,122,24,.32),

}

  to{
    transform:scale(1.25);
    opacity:.65;
  }
}

  display:inline-flex;

.grad{

  background-clip:text;
  color:transparent;
}

.hero p{
  max-width:720px;
  margin:auto;
  color:var(--muted);
  font-size:18px;
  line-height:1.7;
}

  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:30px;
}

.btn{
  padding:14px 20px;
  border-radius:14px;
  font-weight:900;
  border:1px solid #403745;
  background:#17131c;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.btn:hover{
  transform:translateY(-2px);

.primary{

    135deg,
    var(--gold),
    var(--orange)

.sub{
